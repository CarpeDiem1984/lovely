<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Директ · Рабочий кабинет</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202124;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:white;padding:18px 5vw;display:flex;align-items:center;gap:10px;border-bottom:1px solid #dedfe3;font-size:22px;font-weight:650}.logo{display:grid;place-items:center;background:#ed352f;color:white;border-radius:50%;width:34px;height:34px;font-weight:500}main{min-height:calc(100svh - 71px);display:grid;place-items:center;padding:24px}.panel{background:white;border-radius:26px;padding:clamp(24px,5vw,48px);width:min(100%,460px);box-shadow:0 10px 54px #2730540c}h1{font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.045em;margin:8px 0 24px}p{margin:12px 0}small,label{font-size:14px}label{display:block;margin:16px 0 6px}input{font:inherit;width:100%;padding:13px;border:1px solid #aaaeb6;border-radius:12px;background:#fff;color:inherit}input[readonly]{background:#f5f5f7;font-size:14px}button{font:inherit;font-weight:600;border:0;border-radius:12px;background:#ffd530;color:#171717;padding:13px 20px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6753db;outline-offset:2px}form>button,.wide{width:100%;margin-top:16px}.field{position:relative}.field input{padding-right:54px}.help{position:absolute;right:8px;top:6px;padding:6px 12px;border-radius:50%;background:#eee}.tip{display:none;position:absolute;bottom:100%;right:0;background:#24242a;color:white;padding:8px 14px;border-radius:10px;font-size:14px}.help:hover+.tip,.help:focus+.tip{display:block}.error{color:#922c20}.desk{width:min(960px,100%);align-self:start;margin-top:6vh}.row{display:flex;align-items:center;justify-content:space-between;gap:22px;background:white;border-radius:18px;padding:24px;flex-wrap:wrap}.row strong{font-size:23px}.fab{position:fixed;bottom:24px;right:24px;background:#22232a;color:white}.chat{justify-self:end;align-self:end;width:min(430px,100%);max-height:80svh;overflow:auto}.bubble,.own{background:#f2f3f6;border-radius:14px;padding:12px 16px;overflow-wrap:anywhere}.own{background:#fff2b2;margin-left:32px}.recap{background:radial-gradient(ellipse at 85% 20%,#ffab87,transparent 48%),linear-gradient(135deg,#906fea,#ffb5cd)}.story{width:min(640px,100%);background:#fff8f1;border-radius:32px;padding:clamp(24px,6vw,64px)}.progress{display:flex;gap:5px;margin-bottom:32px}.progress i{height:4px;background:#ded6d6;border-radius:8px;flex:1}.progress .on{background:#7949aa}.number{font-size:clamp(38px,8vw,84px);line-height:1.12;color:#742e80;font-weight:750}.voucher{border-top:2px dashed #debbca;margin-top:28px;padding-top:20px}.date{font:italic clamp(34px,7vw,68px) Georgia,serif;color:#832956}
.arcade{background:#17142a;color:#fff5dc}.arcade header{background:#201d35;border-color:#44415a}.arena{width:min(100%,680px)}.arena h1{font-size:clamp(28px,5vw,42px);margin:0}.hud{display:flex;align-items:center;justify-content:space-between;gap:12px}.hud output{white-space:nowrap;background:#ffdb46;color:#312344;border-radius:20px;padding:5px 12px;font-weight:750}.board{position:relative;display:grid;grid-template-columns:repeat(17,1fr);aspect-ratio:17/11;background:#201d35;border:3px solid #a89af7;border-radius:12px;overflow:hidden;container-type:inline-size}.tile{display:grid;place-items:center}.wall{background:#493b78;box-shadow:inset 0 0 0 1px #6957a0;border-radius:14%}.snack{display:grid;place-items:center;width:55%;height:70%;transform:rotate(-7deg);background:linear-gradient(#ffdb37 15%,#ffe872 15% 78%,#fbc726 78%);border-radius:16%;color:#fff;font:italic bold 1.35cqw Georgia}.snack b{background:#b72529;border-radius:50%;padding:0 7%}.actor{position:absolute;width:calc(100% / 17);height:calc(100% / 11);display:grid;place-items:center;font-size:4.1cqw;line-height:1;transition:left .13s linear,top .13s linear;pointer-events:none}.call{position:absolute;bottom:93%;white-space:nowrap;border-radius:8px;padding:4px 7px;background:#fff1ca;color:#352633;font:600 clamp(10px,2cqw,14px)/1.2 sans-serif}.pad{display:flex;justify-content:center;gap:6px}.pad button{padding:8px 16px}.escape{animation:escape 1s ease-in forwards}@keyframes escape{to{transform:translateY(-110cqw) rotate(25deg)}}@media(prefers-reduced-motion:reduce){.actor{transition:none}.escape{animation:none;opacity:0}}
.rainfield{position:relative;height:clamp(240px,47vh,450px);overflow:hidden;border:2px solid #ad9aff;border-radius:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),#564874 calc(20% - 1px) 20%),linear-gradient(#26203e,#34294c)}
.rainfield .runner,.rainword{position:absolute;width:20%;display:grid;place-items:center}
.runner{top:80%;height:12%;font-size:clamp(26px,5vw,45px);line-height:1}
.rainword{height:9%;font-weight:750;font-size:clamp(12px,3vw,24px);color:#ffdf7d}
.rainword span{border:1px solid #9d678d;background:#56354f;padding:0 .25em;border-radius:8px}
</style>
<header><span class="logo">Я</span><span id="brand">Директ</span></header><main id="app"></main>
<script>
const cities = ['Дубай', 'Санкт-Петербург', 'Фетхие', 'Белек', 'Кемер'];
const cards=[
 ['Сколько сообщений вы с Кирюшей отправили друг другу в Telegram за четыре года?','393 500'],
 ['В скольких городах вы побывали вдвоём?',cities.length, cities.join(', ')],
 ['Сколько калорий вы вместе съели?','Бесконечность','Можно было бы прокормить Африку.'],
 ['Сколько раз вы написали «люблю» в переписке в Telegram?','4 712'],
 ['Сколько дней прошло с вашего первого дня вместе?','1 461','С 25 ноября 2022-го по 25 ноября 2026-го.']
];
const key='katyusha-quest-v1',app=document.querySelector('main');
let state={page:'login',idx:0},misses=0;
try{Object.assign(state,JSON.parse(localStorage.getItem(key)))}catch{}
function go(page,extra={}){Object.assign(state,extra,{page});try{localStorage.setItem(key,JSON.stringify(state))}catch{}render()}
function button(text,action){const b=document.createElement('button');b.textContent=text;b.onclick=action;return b}
function render(){
 const {page,idx}=state, memories=page==='quiz'||page==='result';
 document.body.className=memories||page==='voucher'?'recap':'';
 document.querySelector('#brand').textContent=memories?'Воспоминания':'Директ';
 app.innerHTML='<section></section>';const box=app.firstChild;box.className='panel';
 if(page==='dodge'){showDodge(box);return}
 if(page==='maze'){showMaze(box);return}
 if(page==='login'){
 box.innerHTML='<small>Рабочий кабинет</small><h1>Вход в Директ</h1><form autocomplete="off"><label for="login">Логин</label><input id="login" readonly value="samyi.krytoy.junior@mediainstinct.group"><label for="pwd">Пароль</label><div class="field"><input id="pwd" required type="password" aria-describedby="hint"><button class="help" type="button" aria-label="Подсказка к паролю">?</button><span class="tip" id="hint">Пароль подскажет тебе сердце</span></div><p class="error" role="status"></p><button>Войти</button></form>';
 box.querySelector('.help').onclick=e=>e.currentTarget.focus();
 box.querySelector('form').onsubmit=e=>{e.preventDefault();if(box.querySelector('#pwd').value==='25112022')go('campaign');else{misses++;box.querySelector('.error').textContent=misses>1?'Восемь цифр. День, месяц, год.':'Пароль не подошёл. Попробуй ещё раз.';box.querySelector('#pwd').select()}};return}
 if(page==='campaign'||page==='error'){
 box.className='desk';box.innerHTML='<small>Директ / Рекламный кабинет</small><h1>Мои кампании</h1><div class="row"><strong>Фармтек</strong><span>Готова к запуску</span></div>';
 box.querySelector('.row').append(button('Запустить кампанию',e=>{e.target.disabled=true;e.target.textContent='Запускаем…';setTimeout(()=>go('error'),450)}));
 if(page==='error'){box.insertAdjacentHTML('beforeend','<p class="error" role="alert">Не удалось запустить кампанию. Обратитесь в поддержку.</p>');const b=button('Чат с поддержкой',()=>go('chat'));b.className='fab';box.append(b)}return}
 if(['chat','reply','gift'].includes(page)){
 box.classList.add('chat');box.innerHTML='<small>Директ · На связи</small><h1>Поддержка</h1><p class="bubble">Здравствуйте! Чем можем помочь?</p>';
 if(page==='chat'){box.insertAdjacentHTML('beforeend','<form><label for="msg">Ваше сообщение</label><input id="msg" required maxlength="2000"><button>Отправить</button></form>');box.querySelector('form').onsubmit=e=>{e.preventDefault();const msg=box.querySelector('input').value.trim();if(msg)go('reply',{msg})};return}
 const own=document.createElement('p');own.className='own';own.textContent=state.msg;box.append(own);
 box.insertAdjacentHTML('beforeend','<p class="bubble">Да, видим проблему. Вот что показала диагностика: «вашей кампании стресс».</p><p class="bubble">Пока ваша кампания принимает успокоительные, можете зайти в «Яндекс Воспоминания». Мы собрали ваши итоги за четыре года.</p>');
 if(page==='reply')box.append(button('Перейти в Яндекс Воспоминания',()=>go('quiz')));
 else{box.insertAdjacentHTML('beforeend','<p class="bubble">Спасибо за ожидание! Кампания успокоилась. В качестве извинения дарим вам с Кирюшей поездку в отель 5 декабря. 🤍</p>');box.append(button('Открыть ваучер',()=>go('voucher')));box.scrollTop=box.scrollHeight}return}
 box.className='story';
 if(memories){const [q,a,note]=cards[idx];box.innerHTML='<div class="progress">'+cards.map((_,i)=>i<=idx?'<i class="on"></i>':'<i></i>').join('')+'</div><small>Ваши четыре года вместе · '+(idx+1)+' / 5</small><h1>'+q+'</h1>';
 if(page==='quiz'){box.insertAdjacentHTML('beforeend','<form><label for="guess">Твоя версия</label><input id="guess" inputmode="numeric" required maxlength="60"><button>Проверить</button></form>');box.querySelector('form').onsubmit=e=>{e.preventDefault();const guess=box.querySelector('input').value.trim();if(guess)go('result',{guess})}}
 else{const guess=document.createElement('p');guess.textContent='Твоя версия — '+state.guess;box.append(guess);const result=document.createElement('p');result.className='number';result.textContent=a;box.append(result);if(note){const p=document.createElement('p');p.textContent=note;box.append(p)}box.append(idx<4?button('Следующий вопрос',()=>go('quiz',{idx:idx+1})):button('Сыграть за Катюшу',()=>go('maze')))}return}
 box.innerHTML='<small>Подарочный ваучер · Для двоих</small><h1>Катюша, с годовщиной!</h1><div class="date">5 декабря</div><div class="voucher"><p>В этот день мы с тобой едем в отель. В какой — пока сюрприз.</p><p>Люблю тебя. Твой Кирюша 🤍</p></div>';
 box.append(button('Сыграть в «чмоню» ещё раз',()=>go('dodge')));
 box.append(button('Сыграть в чипсы ещё раз',()=>go('maze',{collected:[]})));
}
function showMaze(box, caught=false){
 const map=[
  '#################',
  '#...#.......#...#',
  '#.#.#.##.##.#.#.#',
  '#.#...........#.#',
  '#.###.#.#.#.###.#',
  '#.....#...#.....#',
  '#.###.#.#.#.###.#',
  '#.#...........#.#',
  '#.#.#.##.##.#.#.#',
  '#...#.......#...#',
  '#################'
 ];
 const width=map[0].length, cells=map.join(''), start=width+1;
 const homes=[width+15,width*9+15,width*9+1,width*5+8];
 const packs=Array.from(cells,(_,i)=>i).filter(i=>cells[i]==='.' && i%2===0 && !homes.includes(i) && i!==start);
 const collected=new Set(state.collected||[]);
 const pending=new Set(packs.filter(i=>!collected.has(i)));
 let player=start, ghosts=[...homes], heading=0, queued=0, ticks=0, timer;
 document.body.className='arcade';
 document.querySelector('#brand').textContent='Воспоминания';
 box.className='arena';
 box.innerHTML='<div class="hud"><h1>Охота за чипсами</h1><output></output></div><p>Катюша 👩🏻, собери все вонючие чипсы Lay’s! Кирюши уже бегут за тобой.</p><div class="board" aria-label="Лабиринт"></div><p class="notice" role="status">Стрелки или WASD — двигаться. Нажми направление, чтобы начать.</p><div class="pad"></div>';
 if(caught)box.querySelector('.notice').textContent='Кирюша догнал! Все пачки снова в лабиринте. Нажми направление, чтобы начать заново.';
 const board=box.querySelector('.board'),notice=box.querySelector('.notice'),pad=box.querySelector('.pad');
 const tiles=Array.from(cells,(cell,i)=>{
  const tile=document.createElement('div');tile.className=cell==='#'?'tile wall':'tile';
  if(pending.has(i))tile.innerHTML='<span class="snack"><b>Lay’s</b></span>';
  board.append(tile);return tile;
 });
 function actor(face){const el=document.createElement('span');el.className='actor';el.textContent=face;board.append(el);return el}
 const katya=actor('👩🏻'), men=homes.map(()=>actor('👦🏻'));
 const bubble=document.createElement('span');bubble.className='call';bubble.textContent='Почеши меня!';
 function place(el,pos){el.style.left=(pos%width)*100/width+'%';el.style.top=Math.floor(pos/width)*100/map.length+'%'}
 function draw(){
  place(katya,player);men.forEach((el,i)=>place(el,ghosts[i]));
  men[Math.floor(ticks/18)%men.length].append(bubble);
  box.querySelector('output').textContent=(packs.length-pending.size)+' / '+packs.length;
 }
 const dirs=[-1,1,-width,width];
 function distances(){
  const dist=new Map([[player,0]]),queue=[player];
  for(const pos of queue)for(const dir of dirs){
   const next=pos+dir;
   if(cells[next]==='.'&&!dist.has(next)){dist.set(next,dist.get(pos)+1);queue.push(next)}
  }
  return dist;
 }
 function tick(){
  if(document.hidden)return;
  ticks++;
  if(queued && cells[player+queued]==='.'){heading=queued;queued=0}
  if(cells[player+heading]==='.')player+=heading;
  if(pending.delete(player)){
   tiles[player].textContent='';collected.add(player);state.collected=[...collected];
   try{localStorage.setItem(key,JSON.stringify(state))}catch{}
  }
  if(!pending.size){win();return}
  if(!ghosts.includes(player)&&ticks%4===0){
   const dist=distances();
   ghosts=ghosts.map((pos,i)=>{
    const options=dirs.map(d=>pos+d).filter(n=>dist.has(n));
    options.sort((a,b)=>dist.get(a)-dist.get(b));
    return options[(ticks/4+i)%5===0 && options.length>1?1:0];
   });
  }
  if(ghosts.includes(player)){
   clearInterval(timer);
   document.removeEventListener('keydown',onKey);
   state.collected=[];
   try{localStorage.setItem(key,JSON.stringify(state))}catch{}
   showMaze(box,true);
   return;
  }
  draw();
 }
 function steer(dir){queued=dir;if(!timer){notice.textContent='Собери все пачки Lay’s.';timer=setInterval(tick,165)}}
 const keys={ArrowLeft:-1,ArrowRight:1,ArrowUp:-width,ArrowDown:width,KeyA:-1,KeyD:1,KeyW:-width,KeyS:width};
 function onKey(e){if(keys[e.code]&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();steer(keys[e.code])}}
 function win(){
  clearInterval(timer);document.removeEventListener('keydown',onKey);draw();
  bubble.remove();men.forEach(el=>el.classList.add('escape'));
  notice.textContent='Кирюша убегает: «люблю тебя даже вонючкой»';
  pad.replaceChildren(button('Увернуться от «чмонь»',()=>go('dodge')));
 }
 ['←','→','↑','↓'].forEach((label,i)=>{
  const control=button(label,()=>steer(dirs[i]));control.setAttribute('aria-label',['Влево','Вправо','Вверх','Вниз'][i]);pad.append(control);
 });
 document.addEventListener('keydown',onKey);
 if(pending.size)draw();else win();
}

function showDodge(box){
 const target=20, laneCount=5;
 let lane=2, score=0, running=false, lastFrame, elapsed=0, nextSpawn=0, words=[];
 document.body.className='arcade';
 document.querySelector('#brand').textContent='Воспоминания';
 box.className='arena';
 box.innerHTML='<div class="hud"><h1>Осторожно, чмоня!</h1><output></output></div><p>Катюша, уворачивайся от падающих слов. Продержись 20 слов подряд!</p><div class="rainfield"><span class="runner" role="img" aria-label="Катюша">👩🏻</span></div><p class="notice" role="status">Передвигайся по дорожкам стрелками влево и вправо или клавишами A и D.</p><div class="pad"></div>';
 const field=box.querySelector('.rainfield'), player=box.querySelector('.runner');
 const notice=box.querySelector('.notice'), pad=box.querySelector('.pad');
 function drawPlayer(){player.style.left=lane*20+'%'}
 function drawScore(){box.querySelector('output').textContent=score+' / '+target}
 function move(delta){if(running){lane=Math.max(0,Math.min(laneCount-1,lane+delta));drawPlayer()}}
 function onKey(e){
  const delta={ArrowLeft:-1,KeyA:-1,ArrowRight:1,KeyD:1}[e.code];
  if(delta&&!e.altKey&&!e.metaKey&&!e.ctrlKey){e.preventDefault();if(!e.repeat)move(delta)}
 }
 function end(won){
  running=false;
  document.removeEventListener('keydown',onKey);
  notice.textContent=won?'Все 20 «чмонь» пролетели мимо! Поддержка уже ответила.':'Чмоня попала! Уворотов подряд: '+score+'. Попробуешь ещё?';
  pad.replaceChildren(won?button('Прочитать ответ поддержки',()=>go('gift')):button('Начать заново',start));
 }
 function spawn(){
  const el=document.createElement('div');el.className='rainword';el.innerHTML='<span>чмоня</span>';
  const track=Math.random()<0.5?lane:Math.floor(Math.random()*laneCount);
  el.style.left=track*20+'%';field.append(el);
  words.push({el,lane:track,y:-9,speed:48+score*.7});
 }
 function frame(now){
  const dt=lastFrame===undefined?0:Math.min(50,now-lastFrame);
  lastFrame=now;
  if(!document.hidden){
   elapsed+=dt;
   if(elapsed>=nextSpawn){spawn();nextSpawn=elapsed+1080}
   for(const word of words){
    word.y+=word.speed*dt/1000;word.el.style.top=word.y+'%';
    if(word.y+9>80 && word.y<92 && word.lane===lane){end(false);return}
    if(word.y>=100){word.el.remove();score++;drawScore();if(score===target){end(true);return}}
   }
   words=words.filter(word=>word.y<100);
  }
  requestAnimationFrame(frame);
 }
 function start(){
  words.forEach(word=>word.el.remove());words=[];lane=2;score=elapsed=nextSpawn=0;
  lastFrame=undefined;running=true;drawPlayer();drawScore();
  const left=button('←',()=>move(-1)),right=button('→',()=>move(1));
  left.setAttribute('aria-label','Влево');right.setAttribute('aria-label','Вправо');
  pad.replaceChildren(left,right);notice.textContent='Стрелки ← → или A и D — сменить дорожку.';
  document.addEventListener('keydown',onKey);requestAnimationFrame(frame);
 }
 drawPlayer();drawScore();pad.append(button('Начать игру',start));
}

render();
</script></html>
